services:
  - type: web
    name: govt-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --config gunicorn.conf.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TOKENIZERS_PARALLELISM
        value: "false"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: TURSO_DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false          # set manually in Render dashboard
      - key: FASTEMBED_CACHE_DIR
        value: /var/data/fastembed_cache
    plan: starter
    disk:
      name: model-cache
      mountPath: /var/data
      sizeGB: 1

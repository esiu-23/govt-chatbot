services:
  - type: web
    name: govt-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --config gunicorn.conf.py
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set manually in Render dashboard
      - key: VOYAGE_API_KEY
        sync: false          # set manually in Render dashboard
      - key: DATABASE_URL
        sync: false          # Supabase connection string — set manually in Render dashboard
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
    plan: free
